<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-round.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFD400" />
    
    <!-- Dynamic SEO tags will be injected by React Helmet here -->
    
    <title>ScoreVerse Blog</title>
  
    <!-- PWA / Apple iOS Meta Tags -->
    <meta name="theme-color" content="#FFD400" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScoreVerse" />
    <link rel="apple-touch-icon" href="/playstore-icon.png" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-blog.jsx"></script>
  
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
